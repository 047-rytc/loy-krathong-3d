name: Deploy Loy Krathong 3D to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# กำหนดสิทธิ์สำหรับ GitHub Actions ในการ Deploy ไปยัง GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# อนุญาตให้มี deploy พร้อมกันได้แค่ครั้งเดียว เพื่อป้องกันการชนกันของ deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
